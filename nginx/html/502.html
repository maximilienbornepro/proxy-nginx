<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maintenance en cours - Vitess Studio</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000000;
            font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', 'JetBrains Mono', 'Consolas', monospace;
            color: #e0e0e0;
            padding: 20px;
        }

        .container {
            text-align: center;
            max-width: 520px;
            animation: fadeIn 0.4s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo {
            width: 80px;
            height: 80px;
            margin: 0 auto 24px;
            border: 1px solid #1e1e1e;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0a0a0a;
            animation: pulse 2.5s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% {
                border-color: #1e1e1e;
            }
            50% {
                border-color: #00bcd4;
            }
        }

        .logo svg {
            width: 40px;
            height: 40px;
            color: #00bcd4;
        }

        h1 {
            font-size: 22px;
            font-weight: 700;
            color: #00bcd4;
            margin-bottom: 16px;
            letter-spacing: -0.02em;
        }

        .status {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: rgba(0, 188, 212, 0.08);
            border: 1px solid rgba(0, 188, 212, 0.2);
            padding: 10px 20px;
            border-radius: 3px;
            margin-bottom: 28px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background: #00bcd4;
            border-radius: 2px;
            animation: blink 1.5s ease-in-out infinite;
        }

        @keyframes blink {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.2;
            }
        }

        .status-text {
            font-size: 13px;
            font-weight: 500;
            color: #26c6da;
        }

        .message {
            font-size: 14px;
            line-height: 1.7;
            color: #a0a0a0;
            margin-bottom: 32px;
        }

        .info-box {
            background: #0a0a0a;
            border: 1px solid #1e1e1e;
            border-radius: 4px;
            padding: 20px;
            margin-bottom: 24px;
        }

        .info-box p {
            font-size: 13px;
            color: #666666;
            line-height: 1.7;
        }

        .spinner {
            display: inline-block;
            width: 32px;
            height: 32px;
            border: 2px solid #1e1e1e;
            border-top-color: #00bcd4;
            border-radius: 2px;
            animation: spin 1s linear infinite;
            margin-bottom: 16px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .refresh-hint {
            font-size: 12px;
            color: #444444;
        }

        .refresh-hint a {
            color: #00bcd4;
            text-decoration: none;
            font-weight: 500;
        }

        .refresh-hint a:hover {
            text-decoration: underline;
        }

        .error-code {
            position: fixed;
            bottom: 16px;
            right: 16px;
            font-size: 11px;
            color: #333333;
            font-family: inherit;
        }

        ::selection {
            background: rgba(0, 188, 212, 0.3);
            color: inherit;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z" />
            </svg>
        </div>

        <h1>Vitess Studio</h1>

        <div class="status">
            <span class="status-dot"></span>
            <span class="status-text">Maintenance en cours</span>
        </div>

        <p class="message">
            La plateforme est temporairement indisponible.<br>
            Un deploiement est en cours.
        </p>

        <div class="info-box">
            <div class="spinner"></div>
            <p>
                Nos equipes travaillent a ameliorer votre experience.<br>
                La plateforme sera de nouveau accessible dans quelques instants.
            </p>
        </div>

        <p class="refresh-hint">
            <a href="javascript:location.reload()">Rafraichir la page</a> ou reessayer dans quelques secondes.
        </p>
    </div>

    <div class="error-code">HTTP 502</div>

    <script>
        setTimeout(function() {
            location.reload();
        }, 30000);
    </script>
</body>
</html>

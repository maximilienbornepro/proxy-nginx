events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logging - JSON format for Promtail/Loki
    log_format json_combined escape=json
        '{"time":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"request_method":"$request_method",'
        '"request_uri":"$request_uri",'
        '"status":"$status",'
        '"body_bytes_sent":"$body_bytes_sent",'
        '"request_time":"$request_time",'
        '"http_referer":"$http_referer",'
        '"http_user_agent":"$http_user_agent",'
        '"upstream_addr":"$upstream_addr",'
        '"upstream_response_time":"$upstream_response_time",'
        '"host":"$host"}';
    access_log /var/log/nginx/access.log json_combined;
    error_log /var/log/nginx/error.log warn;

    # Performance
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Map to detect embed parameter for public access
    map $arg_embed $skip_auth {
        default 0;
        ~.+     1;
    }

    # ============================================
    # Stub status for nginx-exporter (internal only)
    # ============================================
    server {
        listen 8080;
        server_name localhost;

        location /stub_status {
            stub_status;
            allow 127.0.0.0/8;
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            deny all;
        }

        location / {
            return 404;
        }
    }

    # ============================================
    # Default HTTPS catch-all (reject unknown hosts)
    # ============================================
    server {
        listen 443 ssl default_server;
        http2 on;
        server_name _;

        ssl_certificate /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;

        return 444;
    }

    # ============================================
    # HTTP -> HTTPS redirect (all domains)
    # ============================================
    server {
        listen 80;
        server_name maximilienborne.fr www.maximilienborne.fr tools.maximilienborne.fr studio.vitess.tech sandbox.studio.vitess.tech rndv.vitess.tech monitoring.vitess.tech tools.vitess.tech;

        location /health {
            return 200 'OK';
            add_header Content-Type text/plain;
        }

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ============================================
    # Redirect old domains to studio.vitess.tech
    # ============================================
    server {
        listen 443 ssl;
        http2 on;
        server_name maximilienborne.fr www.maximilienborne.fr tools.maximilienborne.fr;

        ssl_certificate /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        return 301 https://studio.vitess.tech$request_uri;
    }

    # ============================================
    # studio.vitess.tech - Delivery Process (JWT Auth)
    # ============================================
    server {
        listen 443 ssl;
        http2 on;
        server_name studio.vitess.tech;

        resolver 127.0.0.11 valid=30s;

        ssl_certificate /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;

        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # Custom error pages
        error_page 502 503 504 /502.html;
        location = /502.html {
            root /usr/share/nginx/html;
            internal;
        }

        # JWT Auth verification endpoint
        location = /auth-verify {
            internal;
            set $upstream_unified delivery-unified-server:3010;
            proxy_pass http://$upstream_unified/api/auth/me;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header X-Original-URI $request_uri;
            proxy_set_header X-Original-Args $args;
            proxy_set_header Cookie $http_cookie;
        }

        # Login redirect handler
        location @login_redirect {
            return 302 /?redirect=$request_uri;
        }

        # === All API routes → Unified Server (delivery-unified-server:3010) ===

        # Gateway API (auth, admin, apps, figma)
        location /api/ {
            set $upstream_unified delivery-unified-server:3010;
            proxy_pass http://$upstream_unified;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Pointing Poker API
        location /poker-api/ {
            set $upstream_unified delivery-unified-server:3010;
            rewrite ^/poker-api/(.*) /poker/api/$1 break;
            proxy_pass http://$upstream_unified;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Delivery Figma API (CORS handled by Express, just proxy)
        location /delivery-api/figma/ {
            set $upstream_unified delivery-unified-server:3010;
            rewrite ^/delivery-api/(.*) /delivery/api/$1 break;
            proxy_pass http://$upstream_unified;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Delivery Board API
        location /delivery-api/ {
            set $upstream_unified delivery-unified-server:3010;
            rewrite ^/delivery-api/(.*) /delivery/api/$1 break;
            proxy_pass http://$upstream_unified;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Story Validator API (longer timeout for AI)
        location /story-validator-api/ {
            set $upstream_unified delivery-unified-server:3010;
            rewrite ^/story-validator-api/(.*) /story-validator/api/$1 break;
            proxy_pass http://$upstream_unified;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300;
            proxy_connect_timeout 300;
            proxy_send_timeout 300;
        }

        # Roadmap API
        location /roadmap-api/ {
            set $upstream_unified delivery-unified-server:3010;
            rewrite ^/roadmap-api/(.*) /roadmap/api/$1 break;
            proxy_pass http://$upstream_unified;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Planification API
        location /planification-api/ {
            set $upstream_unified delivery-unified-server:3010;
            rewrite ^/planification-api/(.*) /planification/api/$1 break;
            proxy_pass http://$upstream_unified;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Diagram Generator API (longer timeout for AI)
        location /diagram-generator-api/ {
            set $upstream_unified delivery-unified-server:3010;
            rewrite ^/diagram-generator-api/(.*) /diagram/api/$1 break;
            proxy_pass http://$upstream_unified;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300;
            proxy_connect_timeout 300;
            proxy_send_timeout 300;
        }

        # Conges API
        location /conges-api/ {
            set $upstream_unified delivery-unified-server:3010;
            rewrite ^/conges-api/(.*) /conges/api/$1 break;
            proxy_pass http://$upstream_unified;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # SuiVitess API
        location /suivitess-api/ {
            set $upstream_unified delivery-unified-server:3010;
            rewrite ^/suivitess-api/(.*) /suivitess/api/$1 break;
            proxy_pass http://$upstream_unified;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300;
            proxy_connect_timeout 300;
            proxy_send_timeout 300;
        }

        # === WebSocket (Pointing Poker) ===
        location /socket.io {
            set $upstream_unified delivery-unified-server:3010;
            proxy_pass http://$upstream_unified;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400;
        }

        # === Public preview endpoints (no auth) ===
        location /roadmap-preview/ {
            set $upstream_unified delivery-unified-server:3010;
            rewrite ^/roadmap-preview/(.*) /roadmap/preview/$1 break;
            proxy_pass http://$upstream_unified;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /diagram-preview/ {
            set $upstream_unified delivery-unified-server:3010;
            rewrite ^/diagram-preview/(.*) /diagram/preview/$1 break;
            proxy_pass http://$upstream_unified;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # === Platform SPA (all frontend routes) ===
        # The platform-client serves the React SPA with its own nginx
        # that handles SPA fallback (try_files -> index.html)
        location / {
            set $upstream_platform delivery-platform-client:80;
            proxy_pass http://$upstream_platform;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /health {
            return 200 'OK';
            add_header Content-Type text/plain;
        }
    }

    # ============================================
    # sandbox.studio.vitess.tech - Sandbox/Demo Mode (No Auth)
    # Same as studio.vitess.tech but sandbox mode is detected by Host header
    # ============================================
    server {
        listen 443 ssl;
        http2 on;
        server_name sandbox.studio.vitess.tech;

        resolver 127.0.0.11 valid=30s;

        ssl_certificate /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;

        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # Custom error pages
        error_page 502 503 504 /502.html;
        location = /502.html {
            root /usr/share/nginx/html;
            internal;
        }

        # Sandbox mode: Only allow read-only access to delivery, roadmap, planification
        # API calls go to unified server which detects sandbox mode from Host header

        # Delivery Board API (sandbox)
        location /delivery-api/ {
            set $upstream_unified delivery-unified-server:3010;
            rewrite ^/delivery-api/(.*) /delivery/api/$1 break;
            proxy_pass http://$upstream_unified;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Roadmap API (sandbox)
        location /roadmap-api/ {
            set $upstream_unified delivery-unified-server:3010;
            rewrite ^/roadmap-api/(.*) /roadmap/api/$1 break;
            proxy_pass http://$upstream_unified;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Planification API (sandbox)
        location /planification-api/ {
            set $upstream_unified delivery-unified-server:3010;
            rewrite ^/planification-api/(.*) /planification/api/$1 break;
            proxy_pass http://$upstream_unified;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Platform SPA (sandbox)
        location / {
            set $upstream_platform delivery-platform-client:80;
            proxy_pass http://$upstream_platform;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /health {
            return 200 'OK';
            add_header Content-Type text/plain;
        }
    }

    # ============================================
    # tools.vitess.tech - CV Tools (JWT Auth)
    # ============================================
    server {
        listen 443 ssl;
        http2 on;
        server_name tools.vitess.tech;

        resolver 127.0.0.11 valid=30s;

        ssl_certificate /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;

        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # Custom error pages
        error_page 502 503 504 /502.html;
        location = /502.html {
            root /usr/share/nginx/html;
            internal;
        }

        # === API routes → cvtools-api ===
        location /api/ {
            set $upstream_api cvtools-api:3002;
            proxy_pass http://$upstream_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 180s;
            proxy_connect_timeout 180s;
            proxy_send_timeout 180s;
        }

        # === SPA (cvtools-client) ===
        location / {
            set $upstream_client cvtools-client:80;
            proxy_pass http://$upstream_client;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }


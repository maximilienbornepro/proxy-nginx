    # ============================================
    # rndv.vitess.tech - RNDV Tools (htpasswd Auth)
    # ============================================
    server {
        listen 443 ssl;
        http2 on;
        server_name rndv.vitess.tech;

        resolver 127.0.0.11 valid=30s;

        ssl_certificate /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;

        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # RNDV default
        location / {
            auth_basic "Restricted Access";
            auth_basic_user_file /etc/nginx/.htpasswd;
            set $upstream_rndv rndv-nginx:80;
            proxy_pass http://$upstream_rndv;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /assets/ {
            set $upstream_rndv rndv-nginx:80;
            proxy_pass http://$upstream_rndv;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        location /api/ {
            set $upstream_rndv rndv-nginx:80;
            proxy_pass http://$upstream_rndv;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /health {
            return 200 'OK';
            add_header Content-Type text/plain;
        }
    }

    # ============================================
    # monitoring.vitess.tech - Grafana (htpasswd Auth)
    # ============================================
    server {
        listen 443 ssl;
        http2 on;
        server_name monitoring.vitess.tech;

        resolver 127.0.0.11 valid=30s;

        ssl_certificate /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;

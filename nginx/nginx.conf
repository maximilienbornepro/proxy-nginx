events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    # Performance
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Map to detect embed parameter for public access
    map $arg_embed $skip_auth {
        default 0;
        ~.+     1;
    }

    # ============================================
    # HTTP -> HTTPS redirect (all domains)
    # ============================================
    server {
        listen 80;
        server_name maximilienborne.fr www.maximilienborne.fr tools.maximilienborne.fr studio.vitess.tech rndv.vitess.tech;

        location /health {
            return 200 'OK';
            add_header Content-Type text/plain;
        }

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ============================================
    # Redirect old domains to studio.vitess.tech
    # ============================================
    server {
        listen 443 ssl;
        http2 on;
        server_name maximilienborne.fr www.maximilienborne.fr tools.maximilienborne.fr;

        ssl_certificate /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        return 301 https://studio.vitess.tech$request_uri;
    }

    # ============================================
    # studio.vitess.tech - Delivery Process (JWT Auth)
    # ============================================
    server {
        listen 443 ssl;
        http2 on;
        server_name studio.vitess.tech;

        resolver 127.0.0.11 valid=30s;

        ssl_certificate /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;

        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # JWT Auth verification endpoint
        location = /auth-verify {
            internal;
            set $upstream_gateway delivery-gateway:80;
            proxy_pass http://$upstream_gateway/api/auth/me;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header X-Original-URI $request_uri;
            proxy_set_header X-Original-Args $args;
            proxy_set_header Cookie $http_cookie;
        }

        # Login redirect handler
        location @login_redirect {
            return 302 /?redirect=$request_uri;
        }

        # Gateway root (login page) - no auth
        location = / {
            set $upstream_gateway delivery-gateway:80;
            proxy_pass http://$upstream_gateway;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Gateway API - no auth
        location /api/ {
            set $upstream_gateway delivery-gateway:80;
            proxy_pass http://$upstream_gateway;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Gateway assets - no auth
        location /assets/ {
            set $upstream_gateway delivery-gateway:80;
            proxy_pass http://$upstream_gateway;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        # Pointing Poker
        location = /pointing-poker {
            return 301 $scheme://$host/pointing-poker/;
        }
        location /pointing-poker/assets/ {
            set $upstream_poker_client delivery-poker-client:80;
            rewrite ^/pointing-poker/(.*)$ /$1 break;
            proxy_pass http://$upstream_poker_client;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }
        location /pointing-poker/ {
            auth_request /auth-verify;
            error_page 401 = @login_redirect;
            set $upstream_poker_client delivery-poker-client:80;
            rewrite ^/pointing-poker/(.*)$ /$1 break;
            proxy_pass http://$upstream_poker_client;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Delivery Board
        location /delivery/assets/ {
            set $upstream_delivery_client delivery-delivery-client:80;
            rewrite ^/delivery/(.*)$ /$1 break;
            proxy_pass http://$upstream_delivery_client;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }
        location /delivery {
            auth_request /auth-verify;
            error_page 401 = @login_redirect;
            set $upstream_delivery_client delivery-delivery-client:80;
            rewrite ^/delivery(.*)$ /$1 break;
            proxy_pass http://$upstream_delivery_client;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Planification
        location = /planification {
            return 301 $scheme://$host/planification/;
        }
        location /planification/assets/ {
            set $upstream_planification delivery-planification:3200;
            rewrite ^/planification/(.*)$ /$1 break;
            proxy_pass http://$upstream_planification;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }
        location /planification/ {
            auth_request /auth-verify;
            error_page 401 = @login_redirect;
            set $upstream_planification delivery-planification:3200;
            rewrite ^/planification/(.*)$ /$1 break;
            proxy_pass http://$upstream_planification;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Story Validator
        location = /story-validator {
            return 301 $scheme://$host/story-validator/;
        }
        location /story-validator/assets/ {
            set $upstream_sv_client delivery-story-validator-client:80;
            rewrite ^/story-validator/(.*)$ /$1 break;
            proxy_pass http://$upstream_sv_client;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }
        location /story-validator/ {
            auth_request /auth-verify;
            error_page 401 = @login_redirect;
            set $upstream_sv_client delivery-story-validator-client:80;
            rewrite ^/story-validator/(.*)$ /$1 break;
            proxy_pass http://$upstream_sv_client;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Deeplink Generator
        location = /deeplink-generator {
            return 301 $scheme://$host/deeplink-generator/;
        }
        location /deeplink-generator/assets/ {
            set $upstream_deeplink delivery-deeplink-generator-client:80;
            rewrite ^/deeplink-generator/(.*)$ /$1 break;
            proxy_pass http://$upstream_deeplink;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }
        location /deeplink-generator/ {
            auth_request /auth-verify;
            error_page 401 = @login_redirect;
            set $upstream_deeplink delivery-deeplink-generator-client:80;
            rewrite ^/deeplink-generator/(.*)$ /$1 break;
            proxy_pass http://$upstream_deeplink;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # APIs without auth
        location = /favicon.ico {
            set $upstream_gateway delivery-gateway:80;
            proxy_pass http://$upstream_gateway;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        location /poker-api/ {
            set $upstream_poker_server delivery-poker-server:3001;
            rewrite ^/poker-api/(.*) /api/$1 break;
            proxy_pass http://$upstream_poker_server;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /socket.io {
            set $upstream_poker_server delivery-poker-server:3001;
            proxy_pass http://$upstream_poker_server;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400;
        }

        location /delivery-api/ {
            set $upstream_delivery_server delivery-delivery-server:3002;
            rewrite ^/delivery-api/(.*) /api/$1 break;
            proxy_pass http://$upstream_delivery_server;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /story-validator-api/ {
            set $upstream_sv_server delivery-story-validator-server:3003;
            rewrite ^/story-validator-api/(.*) /api/$1 break;
            proxy_pass http://$upstream_sv_server;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300;
            proxy_connect_timeout 300;
            proxy_send_timeout 300;
        }

        location /health {
            return 200 'OK';
            add_header Content-Type text/plain;
        }
    }

    # ============================================
    # rndv.vitess.tech - RNDV Tools (htpasswd Auth)
    # ============================================
    server {
        listen 443 ssl;
        http2 on;
        server_name rndv.vitess.tech;

        resolver 127.0.0.11 valid=30s;

        ssl_certificate /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;

        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        location / {
            auth_basic "Restricted Access";
            auth_basic_user_file /etc/nginx/.htpasswd;
            set $upstream_rndv rndv-nginx:80;
            proxy_pass http://$upstream_rndv;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /assets/ {
            set $upstream_rndv rndv-nginx:80;
            proxy_pass http://$upstream_rndv;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        location /api/ {
            set $upstream_rndv rndv-nginx:80;
            proxy_pass http://$upstream_rndv;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /health {
            return 200 'OK';
            add_header Content-Type text/plain;
        }
    }
}
